<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juma App — Вход</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F4EE;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 400px;
      width: 100%;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: #C9A84C;
      border-radius: 20px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 {
      color: #1A1A1A;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: #6B6760;
      font-size: 16px;
      margin-bottom: 40px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E8E3DA;
      border-top-color: #C9A84C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { color: #6B6760; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🕌</div>
    <h1>Juma App</h1>
    <p>Попутчики на Джума-намаз</p>
    <div class="spinner"></div>
    <p class="status">Выполняем вход...</p>
  </div>

  <script>
    // Получаем токены из URL hash и передаём обратно в приложение
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');

    if (accessToken) {
      // Редирект обратно в приложение
      const deepLink = `exp+juma-app://expo-development-client/?url=http%3A%2F%2F192.168.10.9%3A8081#access_token=${accessToken}&refresh_token=${refreshToken || ''}&token_type=bearer`;
      window.location.href = deepLink;
    } else {
      document.querySelector('.status').textContent = 'Ожидание авторизации...';
    }
  </script>
</body>
</html>
