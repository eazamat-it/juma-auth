<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juma App — Вход</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F4EE;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 400px;
      width: 100%;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: #C9A84C;
      border-radius: 20px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 { color: #1A1A1A; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: #6B6760; font-size: 16px; margin-bottom: 40px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #E8E3DA;
      border-top-color: #C9A84C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { color: #6B6760; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🕌</div>
    <h1>Juma App</h1>
    <p class="sub">Попутчики на Джума-намаз</p>
    <div class="spinner"></div>
    <p class="status" id="status">Выполняем вход...</p>
  </div>

  <script>
    // Получаем параметры из URL (hash или query)
    const hash = window.location.hash.substring(1);
    const query = window.location.search.substring(1);
    const params = new URLSearchParams(hash || query);
    
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token') || '';
    const expiresAt = params.get('expires_at') || '';
    const tokenType = params.get('token_type') || 'bearer';

    if (accessToken) {
      document.getElementById('status').textContent = 'Открываем приложение...';
      
      // Deep link для продакшн сборки
      const deepLink = `jumaapp://auth/callback#access_token=${accessToken}&refresh_token=${refreshToken}&expires_at=${expiresAt}&token_type=${tokenType}`;
      
      // Пробуем открыть приложение
      window.location.href = deepLink;
      
      // Fallback — если не открылось через 2 секунды
      setTimeout(() => {
        document.getElementById('status').textContent = 'Откройте приложение Juma App вручную';
      }, 2000);
    } else {
      document.getElementById('status').textContent = 'Ожидание авторизации...';
    }
  </script>
</body>
</html>
